spring:
  application:
    name: pair
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    check-template-location: true
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: pair
    password: pair
    driver-class-name: oracle.jdbc.OracleDriver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
        
        
# mybatis config
mybatis:
  mapper-locations: /mappers/**/*.xml
  
