<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<title>admin layout</title>
<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- CSS -->
<link th:href="@{/css/dashboard.css}" rel="stylesheet">
<th:block layout:fragment="css"></th:block>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<script src="https://kit.fontawesome.com/b2b4e46e6d.js"></script>
<!-- Bootstrap Optional JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- JS -->
<th:block layout:fragment="script"></th:block>
<!-- SweetAlert2 -->
<script src="//cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.17/dist/sweetalert2.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.4.17/dist/sweetalert2.min.css"
    rel="stylesheet">
<style>
.swal2-popup {
	font-size: 1.0em !important;
	font-family: 'Noto Sans KR', sans-serif;
}

.swal2-title {
	color: #000;
	font-size: 1.4em !important;
	font-family: 'Gowun Dodum', sans-serif;
}

.swal2-html-container {
	font-size: 0.9em !important;
	font-family: 'Noto Sans KR', sans-serif;
}
</style>
</head>
<body>
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
        <!-- Navbar Brand-->
        <a class="navbar-brand ps-3" href="/">PAIR</a>
        <!-- Sidebar Toggle-->
        <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle"
            href="#!">
            <i class="fas fa-bars"></i>
        </button>
    </nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Product</div>
                        <a class="nav-link collapsed" href="#" data-bs-toggle="collapse"
                            data-bs-target="#collapseLayouts" aria-expanded="false"
                            aria-controls="collapseLayouts">
                            <div class="sb-nav-link-icon">
                                <i class="fa-solid fa-chart-area"></i>
                            </div> 상품 관리
                            <div class="sb-sidenav-collapse-arrow">
                                <i class="fas fa-angle-down"></i>
                            </div>
                        </a>
                        <div class="collapse" id="collapseLayouts" aria-labelledby="headingOne"
                            data-bs-parent="#sidenavAccordion">
                            <nav class="sb-sidenav-menu-nested nav">
                                <a class="nav-link" th:href="@{/admin/product/add}"
                                    onclick="javascript:localStorage.clear();">상품 등록</a> <a
                                    class="nav-link" th:href="@{/admin/product/list}"
                                    onclick="javascript:localStorage.setItem('activeTab', 'total-tab')">상품
                                    목록</a>
                            </nav>
                        </div>
                        <div class="sb-sidenav-footer">
                            <div class="small">로그인 중인 계정:</div>
                            <!-- 로그인(관리자) -->
                            <th:block sec:authorize="isAuthenticated()">
                                <span sec:authentication="principal.name"></span>
                            </th:block>
                        </div>
            </nav>
        </div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div layout:fragment="content"></div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
