<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/admin}">
<head>
<meta charset="UTF-8">
<title>관리자페이지-PAIR</title>
<th:block layout:fragment="css">
	<link th:href="@{/css/customtable.css?after}" rel="stylesheet">
	<link th:href="@{/css/thumbnail.css}" rel="stylesheet">
</th:block>
</head>
<body layout:fragment="content">
	<h1>상품 등록</h1>
	<hr>
	<div class="container content-wrapper">
		<div class="addBox">
			<form id="addForm" name="addForm" class="add-form" th:action="@{/admin/product/add}" method="post" enctype="multipart/form-data">
				<ul>
					<li class="th">
						<p>카테고리</p>
					</li>
					<li class="td"><select id="category" name="category" class="dataTable-selector selector" onchange="changeCategory();">
							<option selected disabled hidden>선택</option>
							<option th:each="category : ${ category }" th:if="${category.lvl == 1}" th:value="${category.categoryNo }" th:text="${ category.categoryNm }"></option>
							</select> <select id="subCategory" name="subCategory" class="dataTable-selector selector">
							<option selected disabled hidden>선택</option>
					</select>
					</li>
				</ul>
				<ul>
					<li class="th">
						<p>브랜드</p>
					</li>
					<li class="td"><select id="brand" name="brand" class="dataTable-selector selector" onchange="addABrand();">
							<option selected disabled hidden>선택</option>
							<option th:each="brand : ${ brand }" th:value="${ brand.brandCd }" th:text="${ brand.brandNm }"></option>
					</select>
				</ul>
				<ul>
					<li class="th">
						<p>상품명</p>
					</li>
					<li class="td"><input type="text" id="prodNm" name="prodNm">
				</ul>
				<!-- DiscountRate ENUM 호출 -->
				<ul>
					<li class="th">
						<p>판매가 및 할인율</p>
					</li>
					<li class="td"><select id="discount" name="discount" class="dataTable-selector selector">
							<option th:each="rate : ${T(com.pro.pair.product.model.dto.DiscountRate).values()}" th:value="${ rate.getValue() }" th:text="|${ rate.getValue() }%|"></option>
					</select> <input type="number" id="prodPrice" name="prodPrice"> 원</li>
				</ul>
				<ul>
					<li class="th">
						<p>상품 한줄 설명</p>
					</li>
					<li class="td"><input type="text" id="prodDesc" name="prodDesc"></li>
				</ul>
				<hr>
				<ul>
					<li class="option_li"><span>이 상품에 다양한 크기, 색상과 같은 옵션이 있나요?&nbsp;&nbsp;</span> <a style="color: #2f89d8;" onclick="optionOpen()">옵션 열기</a></li>
				</ul>
				<div class="optionForm" id="optionForm" style="display: none;">
					<ul>
						<li class="th">
							<p>옵션명 개수</p>
						</li>
						<li class="td"><select id="optionCount" name="optionCount" class="dataTable-selector selector">
								<!-- 기본 선택값 -->
								<option value="" th:text="'--선택--'" th:selected="${optionCount == null}"></option>
								<!-- 실제 옵션들 -->
								<option th:each="i : ${#numbers.sequence(1,3)}" th:value="${i}" th:text="${i + '개'}" th:selected="${i == optionCount}"></option>
						</select></li>
					</ul>
					<ul>
						<li class="th">
							<p>옵션입력</p>
						</li>
						<li class="td"></li>
					</ul>
					<!-- 옵션 row 들어갈 곳 -->
					<div id="optionInputs"></div>
					<button type="button" id="applyOptionBtn" class="btn-apply" >옵션목록으로 적용 ↓</button>
					<table id="optionTable" class="option-table" style="display: none;">
						<thead id="optionTableHead"></thead>
						<tbody id="optionTableBody"></tbody>
					</table>
				</div>
				<hr>
				<div class="contentBox">
					<ul>
						<li class="th">
							<p>상세 내용</p>
						</li>
					</ul>
					<textarea id="prodDetailContent" name="prodDetailContent"></textarea>
				</div>
				<div class="thumbnailBox">
					<ul>
						<li class="th">
							<p>대표 썸네일</p>
						</li>
						<li class="thumbTd" onclick="previewImage()">
							<div class="imageBox">
								<label for="mainThumb" class="thumbLabel"> <i class="fa-solid fa-image" style="font-size: 300%;"></i>
								</label>
							</div>
						</li>
					</ul>
					<ul>
						<li class="th">
							<p>서브 썸네일</p>
						</li>
						<li class="thumbTd" onclick="previewImage()">
							<div class="imageBox">
								<label for="subThumb" class="thumbLabel"> <i class="fa-solid fa-image" style="font-size: 300%;"></i>
								</label>
							</div>
						</li>
					</ul>
					<input type="file" id="mainThumb" name="files" class="files" accept="image/gif,image/jpeg,image/png" style="display: none;">
					<input type="file" id="subThumb" name="files" class="files" accept="image/gif,image/jpeg,image/png" style="display: none;">
				</div>
				<div class="buttonBox">
					<button type="button" class="btn btn-dark" onclick="submitProductForm()">상품등록</button>
				</div>
			</form>
		</div>
	</div>
	<th:block layout:fragment="script">
		<script th:src="@{/js/product.js}" type="text/javascript"></script>
		<!-- CKEditor4 -->
		<script src="//cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>
		<!--       <script src="https://cdn.ckeditor.com/4.19.0/standard/ckeditor.js"></script> -->
		<script type="text/javascript">
			$(function() {
				let ckeditor_config = {
					filebrowserUploadMethod : 'form',
					filebrowserUploadUrl : '/admin/product/add/contentImageUpload',
					language : 'ko'
				};
				CKEDITOR.replace('prodDetailContent', ckeditor_config);
			});
		</script>
	</th:block>
</body>
</html>
