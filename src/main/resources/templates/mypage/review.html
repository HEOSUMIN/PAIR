<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/default}">
<head>
<meta charset="UTF-8">
<title>마이페이지 | 상품리뷰</title>
<!-- CSS -->
<link th:href="@{/css/dashboard.css}" rel="stylesheet">
<th:block layout:fragment="css">
	<link th:href="@{/css/customtable.css}" rel="stylesheet">
</th:block>
</head>
<body th:replace="~{/fragments/mypage.html :: mypage}">
	<div layout:fragment="mypageContent">
		<nav class="mypage-breadcrumb" aria-label="breadcrumb">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a href="/">HOME</a></li>
				<li class="breadcrumb-item"><a th:href="@{/mypage/main}">마이페이지</a></li>
			    <li class="breadcrumb-item active" aria-current="page">상품리뷰</li>
			</ol>
		</nav>
		<div class="mypage-area">
			<fieldset>
				<legend>상품리뷰</legend>
			</fieldset>
			<ul class="review-notice">
				<li> PAIR는 텍스트리뷰 <b>100원</b> / 포토리뷰 <b>300원</b>을 적립해 드리고 있습니다.</li>
			</ul>
			<!-- 작성 가능한 리뷰 | 나의 상품리뷰 -->
			<ul class="nav nav-tabs" id="reviewTab" role="tablist">
				<li class="nav-item" role="presentation">
					<button class="nav-link active" id="write-tab" data-bs-toggle="tab" data-bs-target="#write" type="button" role="tab" aria-controls="write" aria-selected="true">작성 가능한 리뷰</button>
				</li>
				<li class="nav-item" role="presentation">
					<button class="nav-link" id="review-tab" data-bs-toggle="tab" data-bs-target="#review" type="button" role="tab" aria-controls="review" aria-selected="false">내 리뷰</button>
				</li>
			</ul>
			<div class="tab-content" id="myReviewTabContent">
				<div class="tab-pane fade show active" id="write" role="tabpanel" aria-labelledby="write-tab">
					<div class="dataTable-container">
						<table class="reviewlist-table dataTable-table">
							<tbody>
								<tr th:each="itemList : ${ itemList }" th:if="${not #lists.isEmpty(itemList)}">
									<td th:value="${ itemList.orderItem.orderItemNo }"><img th:src="${ itemList.product.attachmentList[0].thumbnailPath }" style="width: 80px; height: 80px;"></td>
									<td class="option-area" th:value="${ itemList.orderItem.optCombNo }">
									<a th:href="@{/product/details(no=${itemList.product.prodNo})}">[[${ itemList.product.prodNm }]]</a>
									<p>
										<span>[[${ itemList.optionComb.optManageNm }]]</span>
									</p>
									</td>
									<td>
										<div class="buttonBox">
											<button type="button" class="reviewBtn btn btn-sm btn-dark" th:onclick="|location.href='@{/review/write(order=${itemList.orderItem.orderItemNo}, option=${itemList.orderItem.optCombNo})}'|">리뷰쓰기</button>
										</div>
									</td>
								</tr>
								<tr class="noitem" th:unless="${#lists.size(itemList)} > 0">
			                		<td colspan="9">
				                		<div><i class="fa-solid fa-circle-exclamation" style="font-size: 300%;"></i></div>
				                		<div>작성 가능한 리뷰가 없습니다.</div>
			                		</td>
			                	</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div class="tab-pane fade show" id="review" role="tabpanel" aria-labelledby="review-tab">
					<div class="dataTable-container">
						<table class="postlist-table dataTable-table">
							<thead style="border-top: 0 !important;">
					    		<tr>
					    			<th><span>no.</span></th>
					    			<th colspan="2"><span>제목</span></th>
					    			<th><span>작성일</span></th>
					    		</tr>
					    	</thead>
							<tbody style="border-top: 0 !important;">
								<tr th:each="postList : ${ postList }" th:if="${not #lists.isEmpty(postList)}">
									<td th:text="${ postListStat.count }"></td>
									 <th:block th:if="${postList.attachmentList != null and !#lists.isEmpty(postList.attachmentList) and postList.attachmentList[0].thumbnailPath != null}">
								        <td th:value="${ postList.orderItemNo }">
								            <img th:src="${ postList.attachmentList[0].thumbnailPath }" style="width: 80px; height: 80px;">
								        </td>
								    </th:block>
								    <th:block th:if="${postList.attachmentList == null or #lists.isEmpty(postList.attachmentList) or postList.attachmentList[0].thumbnailPath == null}">
								        <td th:value="${ postList.orderItemNo }" style="text-align: center;">
								            <div id="imageNotFound"><span class="fs-4">PAIR</span></div>
								        </td>
								    </th:block>
					    			<td>
					    				<p class="review-detail" th:value="${ postList.reviewNo }">
					    					<a data-toggle="modal" th:href="'#review-content' + ${ postList.reviewNo }">
												<span>[[${ postList.product.prodNm }]]-[[${ postList.optionComb.optManageNm }]]</span>	
					    					</a>
					    				</p>
										<th:block layout:fragment="reviewModal">
											<div th:replace="/fragments/modal.html :: reviewModal"></div>
										</th:block>
					    			</td>
					    			<td th:text="${#dates.format(postList.revwRegDate, 'yy.MM.dd')}"></td>
				    			</tr>
				    			<tr class="noitem" th:unless="${#lists.size(postList)} > 0">
			                		<td colspan="9">
				                		<div><i class="fa-solid fa-circle-exclamation" style="font-size: 300%;"></i></div>
				                		<div>작성한 리뷰가 없습니다.</div>
			                		</td>
			                	</tr>
					    	</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!--/* JS */-->
    <th:block layout:fragment="script">
    <!--/* 리뷰 작성 결과 */-->
		<script th:if="${writeReviewMessage}" type="text/javascript">
			const result = '[[${writeReviewMessage}]]'
			if(result.indexOf('완료') > 0) {
				Swal.fire({
					icon: 'success',
					title: result,
					confirmButtonColor: '#00008b',
					confirmButtonText: '확인'
				})
			} else {
				Swal.fire({
					icon: 'error',
					title: result,
					confirmButtonColor: '#00008b',
					confirmButtonText: '확인'
				})
			}
		</script>
    	<script type="text/javascript">
	    	/* Modal */
	    	document.addEventListener('DOMContentLoaded', function(){
		    	$('.review-detail').on('click', function(){
		    		let target = '#' + $(this).parent().children(1)[1].id;
		    		console.log(target);
		    		$(target).modal('show');
			    	/* Rating */
			    	let value = $(this).parent().children(1)[1].children[0].children[0].children[1].children[1].children[2].children[2].attributes[1].textContent;
			    	for(let i=0; i < value; i++) {
			    		let star = $(this).parent().children(1)[1].children[0].children[0].children[1].children[1].children[2].children[2].children[i];
			    		star.style.color = '#00008b';
			    	}
		    		return false;
		    	});
	    	});
    	</script>
    </th:block>
</body>
</html>
